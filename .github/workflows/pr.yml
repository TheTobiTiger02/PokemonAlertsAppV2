name: Pull request checks

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Debug variants only: they build without google-services.json, the
      # Maps key or the signing keystore, so no secrets are needed here.
      # release.yml still runs lintRelease and the release tests on main.
      - name: Unit tests, lint and androidTest compile
        run: |
          ./gradlew --max-workers=2 \
            testDebugUnitTest \
            lintDebug \
            compileDebugAndroidTestKotlin

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-check-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
